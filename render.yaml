# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ats-cv-builder-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Comma-separated frontend origins, e.g. https://your-app.vercel.app,http://localhost:3000
      - key: ALLOWED_ORIGINS
        sync: false
